# windowrule - ######### float popups and dialogue #######
windowrule {
  name = float-auth-required
  match:title = ^(Authentication Required)$
  float = on
  center = on
}

windowrule {
  name = float-vscodium-popups
  match:class = (codium|codium-url-handler|VSCodium)
  match:title = negative:(.*codium.*|.*VSCodium. *)
  float = on
}

windowrule {
  name = float-heroic-popups
  match:class = ^(com.heroicgameslauncher.hgl)$
  match:title = negative:(Heroic Games Launcher)
  float = on
}

windowrule {
  name = float-steam-popups
  match:class = ^([Ss]team)$
  match:title = negative: ^([Ss]team)$
  float = on
}

windowrule {
  name = float-thunar-popups
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar.*)
  float = on
}

windowrule {
  name = float-add-folder-workspace
  match:title = ^(Add Folder to Workspace)$
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
}

windowrule {
  name = float-save-as
  match:title = ^(Save As)$
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
  center = on
}

windowrule {
  name = float-open-files
  match:initial_title = (Open Files)
  float = on
  size = (monitor_w*0.7) (monitor_h*0.6)
}

windowrule {
  name = float-sddm-background
  match:title = ^(SDDM Background)$ #KooL's Dots YAD for setting SDDM background
  float = on
  center = on
  size = (monitor_w*0.16) (monitor_h*0.12)
}
# END of float popups and dialogue #######

# OPACITY
windowrule {
  name = opacity-browser
  match:tag = browser*
  opacity = 0.86 0.84
}

windowrule {
  name = opacity-projects
  match:tag = projects*
  opacity = 0.9 0.8
}

windowrule {
  name = opacity-im
  match:tag = im*
  opacity = 0.94 0.86
}

windowrule {
  name = opacity-multimedia
  match:tag = multimedia*
  opacity = 0.94 0.86
}

windowrule {
  name = opacity-file-manager
  match:tag = file-manager*
  opacity = 0.9 0.8
}

windowrule {
  name = opacity-terminal
  match:tag = terminal*
  opacity = 0.9 0.7
}

windowrule {
  name = opacity-settings
  match:tag = settings*
  opacity = 0.8 0.7
}

windowrule {
  name = opacity-viewer
  match:tag = viewer*
  opacity = 0.82 0.75
}

windowrule {
  name = opacity-wallpaper
  match:tag = wallpaper*
  opacity = 0.9 0.7
}

windowrule {
  name = opacity-text-editor
  match:class = ^(gedit|org.gnome.TextEditor|mousepad)$
  opacity = 0.8 0.7
}

windowrule {
  name = opacity-deluge
  match:class = ^(deluge)$
  opacity = 0.9 0.8
}

windowrule {
  name = opacity-seahorse
  match:class = ^(seahorse)$ # gnome-keyring gui
  opacity = 0.9 0.8
}

windowrule {
  name = opacity-pip
  match:title = ^(Picture-in-Picture)$
  opacity = 0.95 0.75
}

windowrule {
  name = opacity-vscode
  match:class = ^(code)$
  opacity = 0.9
}

# SIZE
windowrule {
  name = size-kool-cheat
  match:tag = KooL_Cheat*
  size = (monitor_w*0.65) (monitor_h*0.9)
}

windowrule {
  name = size-wallpaper
  match:tag = wallpaper*
  size = (monitor_w*0.7) (monitor_h*0.7)
}

windowrule {
  name = size-settings
  match:tag = settings*
  size = (monitor_w*0.7) (monitor_h*0.7)
}

windowrule {
  name = size-whatsapp
  match:class = ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
  size = (monitor_w*0.6) (monitor_h*0.7)
}

windowrule {
  name = size-ferdium
  match:class = ^([Ff]erdium)$
  size = (monitor_w*0.6) (monitor_h*0.7)
}

windowrule {
  name = size-kdeconnect
  match:class = ^(org.kde.kdeconnect.app)$
