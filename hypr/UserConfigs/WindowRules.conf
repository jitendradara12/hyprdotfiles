}

windowrule {
  name = viewer-image
  match:class = ^(eog|org.gnome. Loupe)$ # image viewer
  tag = +viewer
}

# Some special override rules
windowrule {
  name = multimedia-video-no-blur
  match:tag = multimedia_video*
  no_blur = on
  opacity = 1.0
}

# POSITION
windowrule {
  name = kool-cheat-center
  match:tag = KooL_Cheat*
  center = on
}

windowrule {
  name = thunar-center
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar. *)
  center = on
}

windowrule {
  name = rog-control-center
  match:title = ^(ROG Control)$
  center = on
}

windowrule {
  name = kool-settings-center
  match:tag = KooL-Settings*
  center = on
}

windowrule {
  name = keybindings-center
  match:title = ^(Keybindings)$
  center = on
}

windowrule {
  name = audio-settings-center
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
  center = on
}

windowrule {
  name = whatsapp-center
  match:class = ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
  center = on
}

windowrule {
  name = ferdium-center
  match:class = ^([Ff]erdium)$
  center = on
}

windowrule {
  name = pip-position
  match:title = ^(Picture-in-Picture)$
  move = (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5))
}

