}

# Focus rules
windowrule {
  name = noinitialfocus-jetbrains
  match:class = ^(jetbrains-*)
  no_initial_focus = on
}

windowrule {
  name = noinitialfocus-wind
  match:title = ^(wind. *)$
  no_initial_focus = on
}

# VSCode blur
windowrule {
  name = vscode-opacity-blur
  match:class = ^(code)$
  opacity = 0.86
}

# LAYER RULES
layerrule {
  name = rofi-blur
  match:namespace = rofi
  blur = on
  ignore_alpha = 0
}

layerrule {
  name = notifications-blur
  match:namespace = notifications
  blur = on
  ignore_alpha = 0
}

layerrule {
  name = quickshell-overview-blur
  match:namespace = quickshell: overview
  blur = on
  ignore_alpha = 0.5
}

layerrule {
  name = waybar-blur
  match:namespace = waybar
  blur = on
  ignore_alpha = 0
}

layerrule {
  name = swaync-control-center-blur
  match:namespace = swaync-control-center
  blur = on
}

layerrule {
  name = swaync-notification-blur
  match:namespace = swaync-notification-window
  blur = on
  ignore_alpha = 0
}
